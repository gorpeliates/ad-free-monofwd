[project]
name = "code"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "ipykernel>=7.2.0",
    "jupyterlab>=4.5.6",
    "matplotlib>=3.10.8",
    "numpy>=2.4.4",
    "pandas>=3.0.2",
    "torch>=2.11.0",
    "torchvision>=0.26.0",
]

[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true


[tool.uv.sources]
torch = [
    { index = "pytorch-cu130",marker = "sys_platform == 'win32'" },
    { index = "pytorch-cu129",marker = "sys_platform == 'linux'" }
]
torchvision = [
    { index = "pytorch-cu130",marker = "sys_platform == 'win32'" },
    { index = "pytorch-cu129",marker = "sys_platform == 'linux'" }
]
torchaudio = [
    { index = "pytorch-cu130",marker = "sys_platform == 'win32'" },
    { index = "pytorch-cu129",marker = "sys_platform == 'linux'" }
]